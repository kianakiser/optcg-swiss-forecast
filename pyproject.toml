[project]
name = "optcg-swiss-forecast"
version = "0.1.0"
description = "Predicting One Piece Card Game swiss match outcomes"
requires-python = ">=3.12,<3.15"
dependencies = [
    "hopsworks[python]==5.2.2",
    "pandas>=2.3.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/optcg/features"]
