name: Daily features

on:
  workflow_dispatch:
  schedule:
    # Daily run at 21:17 UTC.
    - cron: "17 21 * * *"

permissions:
  contents: read

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_FEATURES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Refresh checked events and store their features
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: uv run --locked --no-dev src/optcg/features/run.py --mode daily --publish
