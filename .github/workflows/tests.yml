name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.16"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: docker build --platform linux/amd64 --tag optcg-features .
      - run: docker run --rm --platform linux/amd64 optcg-features --help
